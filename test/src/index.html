<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chingum's Coconut Chaos</title>

    <link rel="stylesheet" href="index.css">
</head>

<body class="home-page">

    <main class="landing">

        <div class="hero-card">

            <div class="badge">
                🔫 MINI ARCADE GAME
            </div>

            <h1>
                CHINGUM'S
                <span>COCONUT CHAOS</span>
            </h1>

            <p class="tagline">
                Chingum ke changul se bachna bole to...
                <strong>YUM POSSIBLE!</strong>
            </p>

            <!-- HOME SCENE ONLY -->
            <div class="scene-wrapper">
                <img src="./scene.png" alt="Chingum Coconut Scene">
            </div>

            <button class="start-btn" id="startGameBtn">
                🔫 START GAME
            </button>

            <p class="instruction">
                🎯 Shoot the coconuts • Survive • Get the highest score
            </p>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
