<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gun Slider</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #slider{
            height: 500px;
            display: flex;
            gap: 20px;
            overflow: scroll;
            scrollbar-width: none;
            scroll-behavior: smooth;
            position:sticky;
            left: 0px;
        }
        #slider img{
            width: 700px;
            height: 500px;
            object-fit: cover;
            flex-shrink: 0;
            border-radius: 15px;
        }        
        #slider::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
    <div id="slider">
        <img src="./Gun Slider_files/main1.jpg" alt="front">
        <img src="./Gun Slider_files/ak.jpg" alt="ak">
        <img src="./Gun Slider_files/sniper1.jpg" alt="Sniper">
        <img src="./Gun Slider_files/sni1.jpg" alt="Sniper 2">
        <img src="./Gun Slider_files/47.jpg" alt="ak 47">
    </div>

</body></html>
