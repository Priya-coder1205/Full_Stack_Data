<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Gallery</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#222;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.gallery{
    width:500px;
    height:550px;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:180px 180px 190px;
    border:3px solid white;
    overflow:hidden;
}

.box{
    border:2px solid white;
    overflow:hidden;
}

.box img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.box1{
    grid-column:1/3;
}

.box2{
    grid-column:1/2;
}

.box3{
    grid-column:2/3;
}

.box4{
    grid-column:1/2;
}

.box5{
    grid-column:2/3;
}

</style>

</head>

<body>

<div class="gallery">

    <div class="box box1">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTfeceS7hQ3Fj3QajICnHUg0ZSR3wiFAPYYU9Fw_5u6IyH4Rq5Kv1CTKp8&s=10">
    </div>

    <div class="box box2">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSnXQKxNtPLf0JB4a4u2SbLsGVPdNNhKyFoCu-3syEEWL3uAxGaHdX09Tk&s=10">
    </div>

    <div class="box box3">
        <img src="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa">
    </div>

    <div class="box box4">
        <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455">
    </div>

    <div class="box box5">
        <img src=https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSDKZKitWa4RV2sOxuzDOKdKwonfIwxuHdVSmXZmKMxEw&s>
    </div>

</div>

</body>
</html>
