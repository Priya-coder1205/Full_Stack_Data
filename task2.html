<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gun Slider</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #slider{
            height: 500px;
            display: flex;
            gap: 20px;
            overflow: scroll;
            scrollbar-width: none;
            scroll-behavior: smooth;
            
        }
        #slider img{
            width: 700px;
            height: 500px;
            object-fit: cover;
            flex-shrink: 0;
            border-radius: 15px;
            position: sticky;
            left: 0px;
        }        
        #slider::-webkit-scrollbar {
            display: none;
        }
        .heading {
            text-align: center;
            margin-bottom: 50px;
            text-align: center;
            font-size: 55px;
            color: #fff;    
        }
    </style>
</head>
<body>
    <div id="slider">
        <img src="main1.jpg" alt="front">
        <img src="ak.jpg" alt="ak">
        <img src="sniper1.jpg" alt="Sniper">
        <img src="sni1.jpg" alt="Sniper 2">
        <img src="47.jpg" alt="ak 47">
    </div>
    <div class="arsenal">

        <!-- TITLE -->
        <div class="heading">

            <h1>
                TARGET LOCKED
            </h1>

            <p>
                DREAM LOADED // NO RESPAWN
            </p>

        </div>
    </div>
</body>
</html>
