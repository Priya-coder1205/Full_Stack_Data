<!DOCTYPE html>
<html>

<head>

    <title>Health Level</title>

    <style>
        body {
            background: radial-gradient(circle, #778ccd, #c272eb, rgb(127, 215, 244));
        }

        .box {
            height: 200px;
            width: 400px;
            background-color: rgb(235, 208, 232);
            padding: 30px;
            margin: 100px auto;
            border-radius: 20px;
        }

        p {
            font-size: 20px;
            font-weight: bold;
            color: rgb(132, 57, 147);
        }

        h1 {
            color: rgb(235, 18, 231);
        }

        .bar {
            width: 100%;
            height: 25px;
            border-radius: 20px;
            align-items: center;
            background-color: rgb(177, 172, 172);
        }

        .health {
            width: 75%;
            height: 25px;
            border-radius: 20px;
            background: linear-gradient(to right, rgb(210, 181, 219), rgb(222, 124, 225), rgb(208, 76, 201));
        }

        .score {
            color: rgb(14, 14, 57);
            font-size: 25px;
        }
    </style>

</head>

<body>

    <div class="box">

        <h1>Health Level</h1>

        <p>Your current health status</p>

        <div class="bar">
            <div class="health"></div>
        </div>

        <p class="score">Health Score: 70%</p>

    </div>

</body>

</html>
