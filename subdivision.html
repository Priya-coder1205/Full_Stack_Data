<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --primary-color: rgb(212, 22, 22);
            --text-size: 30px;
        }
        .container{
            background-color: var(--primary-color);
            height: 500px;
            width: 500px;
            display:grid;
            outline: 1px solid black;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
        }
        .container>div{
            font-size: calc(var(--text-size)*2);
            outline:1px dashed black;
            text-align: center;
        }
        .parent{
            display:grid;
            background-color: rgb(212, 22, 22);
            grid-template-columns: subgrid;
            grid-template-rows: subgrid;
            grid-column: 1 / 3;
            grid-row: 1 / 3;
        }
        .child{
            display:grid;
            background-color: rgb(24, 5, 5);
            color: white;
            grid-column: 2 / 3;
            grid-row: 2 / 3;
        }
        #box2{
            background-color: rgb(245, 245, 10);
            grid-column: 3 / 4;
        }
        
        #box3{
            background-color: rgb(245,245, 10);
            grid-row: 3 / 4;
            grid-column: 1 / 2;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="parent">
            <div class="child">
                1
            </div>
        </div>
        <div id="box2">2</div>
        <div id="box3">3</div>
    </div>
</body>
</html>
